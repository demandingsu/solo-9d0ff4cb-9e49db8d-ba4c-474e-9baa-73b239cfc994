server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 页面为 UTF-8 中文，显式声明避免浏览器乱码
    charset utf-8;

    # 故障演示：套-007 套件详情服务不可用（503），模拟套件详情抓取失败。
    # 静态文件仍保留在 html/suite/t007.html 以便人工查看，但 nginx 直接返回 503。
    location = /suite/t007.html {
        return 503;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
